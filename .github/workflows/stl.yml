name: Génération STL

on:
  push:
    branches: [main]
    paths:
      - "coque/**"
      - "resolve.py"
      - "requirements.txt"
      - ".github/workflows/stl.yml"
  workflow_dispatch:
    inputs:
      optimiser:
        description: "Lancer l'optimisation CMA-ES (long) au lieu de --test"
        type: boolean
        default: false
      runs:
        description: "Nombre de départs CMA-ES (mode optimiser)"
        type: string
        default: "8"
      budget:
        description: "Budget total d'évaluations (mode optimiser)"
        type: string
        default: "20000"

jobs:
  stl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests (formes analytiques, étanchéité, non-régression)
        run: python -m pytest -q

      # Reprise/sauvegarde de l'état d'optimisation entre deux runs manuels.
      - name: Cache checkpoints
        if: ${{ inputs.optimiser == true }}
        uses: actions/cache@v4
        with:
          path: checkpoints
          key: checkpoints-${{ github.run_id }}
          restore-keys: checkpoints-

      - name: Générer les STL
        run: |
          if [ "${{ inputs.optimiser }}" = "true" ]; then
            python3 resolve.py --runs "${{ inputs.runs }}" --budget "${{ inputs.budget }}" --out outputs
          else
            python3 resolve.py --test --out outputs
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: coque-stl
          path: |
            outputs/*.stl
            outputs/*.json
            outputs/*.png
          if-no-files-found: error
